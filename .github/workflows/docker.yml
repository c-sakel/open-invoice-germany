name: Docker

# Container-Image ghcr.io/c-sakel/open-invoice-germany.
#   Pull Request  -> Image bauen und gegen PostgreSQL testen (nichts wird veroeffentlicht)
#   Tag v1.2.3    -> testen, dann amd64 + arm64 nativ bauen und als 1.2.3, 1.2, 1, latest veroeffentlichen
#   manuell       -> wie ein Tag, aber mit dem Branch-Namen als Image-Tag (z. B. :main)

on:
  push:
    tags: ["v*.*.*"]
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - package.json
      - package-lock.json
      - next.config.ts
      - prisma/schema.postgres.prisma
      - prisma/migrations-postgres/**
      - prisma.postgres.config.ts
      - scripts/docker-entrypoint.sh
      - scripts/db-prepare.sh
      - .github/workflows/docker.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/c-sakel/open-invoice-germany

jobs:
  test:
    name: Image testen (amd64, PostgreSQL)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Bauen
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: oig:ci
          cache-from: type=gha,scope=linux-amd64
          cache-to: type=gha,scope=linux-amd64,mode=max
      - name: Inhalt pruefen (Nicht-root, keine Repo-Dateien)
        run: |
          set -eu
          test "$(docker run --rm --entrypoint id oig:ci -u)" = 1000
          # Nur Laufzeitdateien: keine Screenshots, Doku, Tests, Quelltexte oder Secrets.
          stray=$(docker run --rm --entrypoint sh oig:ci -c \
            'find /app -path /app/node_modules -prune -o -type f \( -name "*.md" -o -name "*.png" -o -name "*.test.*" -o -name "*.tsx" -o -name ".env*" -o -name "*.db" -o -path "/app/docs/*" -o -path "/app/test/*" -o -path "/app/src/*.ts" \) -print')
          if [ -n "$stray" ]; then echo "Unerwartete Dateien im Image:"; echo "$stray"; exit 1; fi
          docker image inspect oig:ci --format 'Groesse: {{.Size}} Bytes'
      - name: Gegen PostgreSQL starten
        run: |
          set -eu
          docker network create oig
          docker run -d --name db --network oig -e POSTGRES_USER=oig -e POSTGRES_DB=openinvoice \
            -e POSTGRES_PASSWORD=ci postgres:16-alpine
          for i in $(seq 1 30); do docker exec db pg_isready -U oig -d openinvoice && break; sleep 2; done
          docker run -d --name app --network oig -p 3000:3000 \
            -e DATABASE_URL="postgresql://oig:ci@db:5432/openinvoice?schema=public" \
            -e AUTH_SECRET="ci-only-secret-0123456789abcdefghijklmnop" \
            oig:ci
          for i in $(seq 1 60); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' app)" = healthy ] && break
            [ "$(docker inspect -f '{{.State.Running}}' app)" = true ] || break
            sleep 3
          done
          docker logs app
          test "$(docker inspect -f '{{.State.Health.Status}}' app)" = healthy
          for path in / /login /api/health /layouts/klassik.svg; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:3000$path")
            echo "$path -> $code"; test "$code" = 200
          done
      - name: Aufraeumen
        if: always()
        run: docker rm -f app db >/dev/null 2>&1 || true

  build:
    name: Bauen (${{ matrix.platform }})
    if: github.event_name != 'pull_request'
    needs: test
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - name: Plattform-Kennung
        run: echo "PLATFORM_PAIR=${PLATFORM//\//-}" >> "$GITHUB_ENV"
        env:
          PLATFORM: ${{ matrix.platform }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Metadaten
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          # Gleiche Regeln wie im merge-Job, damit VERSION im Image zum Tag passt (1.2.3 statt v1.2.3).
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=ref,event=branch
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Bauen und per Digest hochladen
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            REVISION=${{ github.sha }}
            CREATED=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.created'] }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,scope=${{ env.PLATFORM_PAIR }},mode=max
      - name: Digest merken
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Veroeffentlichen
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Metadaten
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: index
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=ref,event=branch
      - name: Multi-Arch-Manifest anlegen (Tags + Annotationen)
        working-directory: ${{ runner.temp }}/digests
        run: |
          set -eu
          args=()
          while IFS= read -r t; do args+=(-t "$t"); done < <(jq -r '.tags[]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          while IFS= read -r a; do args+=(--annotation "$a"); done < <(jq -r '.annotations[]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          docker buildx imagetools create "${args[@]}" $(printf "$IMAGE@sha256:%s " *)
      - name: Pruefen
        run: docker buildx imagetools inspect "$IMAGE:$VERSION"
        env:
          VERSION: ${{ steps.meta.outputs.version }}

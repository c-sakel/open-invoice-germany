name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --no-audit --no-fund # nicht npm ci: saxon-js zieht plattformspezifische optionale Deps
      - run: npx prisma generate
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          DATABASE_URL: "file:./dev.db"
      - name: OpenAPI-Drift-Check (Generat aus src/app/api/v1/**/route.ts == openapi/openapi.json)
        run: npm run api:check
        env:
          DATABASE_URL: "file:./dev.db"
      - name: EN-16931-Schematron-Validierung (offiziell, via SaxonJS, ohne Java)
        run: npm run validate:erechnung

  # Zusätzliche XRechnung-CIUS-/XSD-Prüfung mit dem offiziellen KoSIT-Validator (Java) —
  # der EINZIGE Lauf mit echter XSD-Prüfung (SaxonJS im build-test-Job prüft nur
  # Schematron, siehe docs/LIMITATIONEN.md „E-Rechnung"). Prüft seit Fix-Welle 1
  # (S4, Abschluss-Review Phase 13b) ALLE Fixtures aus scripts/validate-erechnung.ts
  # (dieselbe Liste, 21 Beispiele/41 XML-Dateien) statt nur „base" — vorher sah dieser
  # Job z. B. die Betreff-Fixture (Task 5) nie.
  # continue-on-error ENTFERNT (S4): der Validator (1.6.3 + Konfiguration 2026-08-31,
  # dieselben Pins wie unten) ist laut Ledger (.claude/verlauf.md, Stand 2026-09-07:
  # „in eclipse-temurin:17 auf dem Server verifiziert: ACCEPTABLE") und Phase 12b
  # (progress.md: „39/39 KoSIT") mehrfach erfolgreich gelaufen — die urspruengliche
  # Bedingung „solange nicht lokal verifiziert" (siehe git log -S auf diesen Job) ist
  # erfuellt, das Gate blockt PRs jetzt scharf.
  xrechnung-kosit:
    runs-on: ubuntu-latest
    env:
      # Validator 1.5.x bringt auf Java 17 kein JAXB mit (ClassNotFoundException
      # javax.xml.bind.*) — 1.6.x ist Java-17-faehig. Konfiguration = XRechnung 3.0.2.
      VALIDATOR_VERSION: "1.6.3"
      CONFIG_RELEASE: "v2026-08-31"
      CONFIG_FILE: "xrechnung-3.0.2-validator-configuration-2026-08-31"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: npm install --no-audit --no-fund # nicht npm ci: saxon-js zieht plattformspezifische optionale Deps
      - run: npx prisma generate
      - name: Alle Beispiel-XRechnungen erzeugen (22 Fixtures, UBL + CII)
        run: |
          mkdir -p tmp/xrechnung-samples
          # Dieselbe Fixture-Liste wie SAMPLE_NAMES in scripts/validate-erechnung.ts
          # (dort der SaxonJS-Lauf im build-test-Job) — "base" nur als UBL (Bestands-
          # regression), alle anderen als UBL UND CII.
          SAMPLES="base line-discount doc-discount-two-rates charge skonto-two-terms cash credit-note-doc-discount no-iban card-48 sepa-59 sections credit-note-sections downpayment-386 partial-percent final-two-downpayments reverse-charge-ae ig-lieferung-k ausfuhr-g kleinunternehmer-e differenz-e betreff-note lieferanschrift-bg15"
          for sample in $SAMPLES; do
            npx tsx scripts/generate-sample-xrechnung.ts "tmp/xrechnung-samples/${sample}-ubl.xml" "$sample" ubl
            if [ "$sample" != "base" ]; then
              npx tsx scripts/generate-sample-xrechnung.ts "tmp/xrechnung-samples/${sample}-cii.xml" "$sample" cii
            fi
          done
      - name: KoSIT-Validator + XRechnung-Konfiguration laden
        run: |
          mkdir -p kosit/config
          curl -fsSL -o kosit/validator-standalone.jar \
            "https://github.com/itplr-kosit/validator/releases/download/v${VALIDATOR_VERSION}/validator-${VALIDATOR_VERSION}-standalone.jar"
          curl -fsSL -o kosit/config.zip \
            "https://github.com/itplr-kosit/validator-configuration-xrechnung/releases/download/${CONFIG_RELEASE}/${CONFIG_FILE}.zip"
          unzip -q kosit/config.zip -d kosit/config
      - name: Validieren (alle Fixtures)
        run: |
          JAR=kosit/validator-standalone.jar
          SCENARIOS=$(find kosit/config -name 'scenarios.xml' | head -1)
          REPO=$(dirname "$SCENARIOS")
          echo "Validator: $JAR"
          echo "Szenarien: $SCENARIOS"
          fail=0
          for f in tmp/xrechnung-samples/*.xml; do
            echo "=== $f ==="
            java -jar "$JAR" -s "$SCENARIOS" -r "$REPO" "$f" || fail=1
          done
          exit $fail

      # Task 6/7 (Phase 14a): PDF/A-3b-Nachweis fuer den ZUGFeRD-Hybrid-Container (und,
      # da dieselbe Fabrik src/lib/pdf/document.ts nutzt, auch Lieferschein/Mahnung).
      # Java 17 liegt in diesem Job bereits vor (siehe setup-java oben) — kein eigener
      # Job noetig, solange veraPDF darunter laeuft (Ruling, siehe COMPLIANCE.md/Ledger:
      # laut offizieller veraPDF-Doku wird die Installation unter Java 8/11/17/21
      # unterstuetzt; bricht der Schritt hier dennoch ab, ist die Ausweiche ein eigener
      # Job mit `actions/setup-java` auf Java 11 statt eines stillschweigenden Wegfalls).
      - name: PDF/A-3b-Muster erzeugen (ZUGFeRD-Rechnung mit Logo/GiroCode, Lieferschein, Mahnung)
        run: npx tsx scripts/render-pdfa-samples.ts
      - name: veraPDF installieren (IzPack, headless — nur das CLI-Paket)
        run: |
          curl -fsSL -o verapdf-installer.zip "https://software.verapdf.org/releases/verapdf-installer.zip"
          unzip -q verapdf-installer.zip -d verapdf-installer
          cat > verapdf-auto-install.xml <<'XML'
          <?xml version="1.0" encoding="UTF-8" standalone="no"?>
          <AutomatedInstallation langpack="eng">
          <com.izforge.izpack.panels.htmlhello.HTMLHelloPanel id="welcome"/>
          <com.izforge.izpack.panels.target.TargetPanel id="install_dir">
          <installpath>/tmp/verapdf</installpath>
          </com.izforge.izpack.panels.target.TargetPanel>
          <com.izforge.izpack.panels.packs.PacksPanel id="sdk_pack_select">
          <pack index="0" name="veraPDF GUI" selected="false"/>
          <pack index="1" name="veraPDF CLI" selected="true"/>
          <pack index="2" name="veraPDF Documentation" selected="false"/>
          <pack index="3" name="veraPDF Sample Plugins" selected="false"/>
          </com.izforge.izpack.panels.packs.PacksPanel>
          <com.izforge.izpack.panels.install.InstallPanel id="install"/>
          <com.izforge.izpack.panels.finish.FinishPanel id="finish"/>
          </AutomatedInstallation>
          XML
          INSTALLER_JAR=$(find verapdf-installer -name "verapdf-izpack-installer-*.jar" | head -1)
          java -jar "$INSTALLER_JAR" verapdf-auto-install.xml
      - name: PDF/A-3b pruefen (veraPDF, Profil 3b — Rechnung, Lieferschein, Mahnung)
        run: /tmp/verapdf/verapdf -f 3b tmp/pdfa-samples/*.pdf

  # Die beiden Schemadateien sind bis auf die Provider-Zeile zeichengleich.
  # Laufen sie auseinander, entstehen unvollstaendige Postgres-Migrationen —
  # genau so fehlten RecurringInvoice/RecurringInvoiceLine ueber Monate.
  schema-drift:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Schemadateien vergleichen
        run: |
          diff <(sed 's/provider = "sqlite"/PROVIDER/' prisma/schema.prisma) \
               <(sed 's/provider = "postgresql"/PROVIDER/' prisma/schema.postgres.prisma) \
            && echo "Schemadateien sind deckungsgleich."

  postgres-migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --no-audit --no-fund
      - run: ./scripts/test-postgres-migrations.sh

# OpenInvoice Germany — Self-Hosting mit PostgreSQL.
#
#   1. .env neben dieser Datei anlegen (wird nie committet):
#        POSTGRES_PASSWORD=<openssl rand -hex 24>
#        AUTH_SECRET=<openssl rand -hex 32>
#        # optional: CRON_SECRET, APP_BASE_URL, OIG_VERSION (Standard: 1 = neueste 1.x)
#   2. docker compose up -d            -> fertiges Image aus ghcr.io
#      docker compose up -d --build    -> stattdessen aus diesem Checkout bauen
#   3. http://localhost:3000 oeffnen und das Konto einrichten.
#
# Die App lauscht nur auf 127.0.0.1. Fuer den Zugriff von aussen einen TLS-Reverse-Proxy
# davorsetzen (X-Forwarded-Proto weiterreichen, siehe README).
# (Fuer den Solo-Betrieb ohne Server genuegt SQLite — siehe README, kein Docker noetig.)

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: oig
      POSTGRES_DB: openinvoice
      # Nur Buchstaben und Ziffern (steht unkodiert in DATABASE_URL).
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD fehlt in .env}
    volumes:
      - oig-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oig -d openinvoice"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    image: ghcr.io/c-sakel/open-invoice-germany:${OIG_VERSION:-1}
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql://oig:${POSTGRES_PASSWORD}@db:5432/openinvoice?schema=public"
      # Pflicht in Produktion: signiert die Sitzungs-Cookies.
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET fehlt in .env}
      # Pflicht, sobald /api/cron/* genutzt wird — ohne Wert antworten die Routen mit 503.
      CRON_SECRET: ${CRON_SECRET:-}
      APP_BASE_URL: ${APP_BASE_URL:-}
      # Scheduler (Mahnwesen/Abos) laeuft im App-Prozess mit (siehe .env.example). Bei
      # mehreren Repliken verhindert der DB-Mutex (SchedulerLock) doppelte Laeufe; die
      # ueberzaehligen Versuche lassen sich mit SCHEDULER_ENABLED=false abschalten.
      SCHEDULER_ENABLED: ${SCHEDULER_ENABLED:-}
      SCHEDULER_INTERVAL_MINUTES: ${SCHEDULER_INTERVAL_MINUTES:-}
    volumes:
      # Beleganhaenge und write-once-Belegarchiv (GoBD) — zusammen mit oig-db sichern.
      - oig-attachments:/app/data/attachments
      - oig-archive:/app/data/archive
    ports:
      - "127.0.0.1:3000:3000"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  oig-db:
  oig-attachments:
  oig-archive:
